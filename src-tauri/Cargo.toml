[package]
name = "mdreader"
version = "0.1.1"
description = "Lightweight cross-platform desktop Markdown viewer and editor"
authors = ["Andrii Frantyk"]
license = "MIT"
homepage = "https://github.com/A-Frantyk/mdreader"
repository = "https://github.com/A-Frantyk/mdreader"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mdreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Only for build.rs's theme CSS generation — no default-syntaxes/dump-create needed.
syntect = { version = "5", default-features = false, features = ["default-themes", "html", "regex-fancy"] }
# Build-only, for build.rs's generate_markdown_extensions.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
pulldown-cmark = "0.12"
pulldown-cmark-escape = "0.11"
ammonia = "4"
# regex-fancy is pure Rust (no Oniguruma/C toolchain); no theme features —
# themes are resolved to static CSS at build time, see build.rs.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
percent-encoding = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

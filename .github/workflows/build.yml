name: Build

# Produces per-platform installers as downloadable workflow artifacts —
# whichever formats tauri.conf.json's bundle.targets:"all" yields on each
# OS (macOS: a universal .dmg; Windows: NSIS .exe and MSI; Linux: .deb/.rpm,
# plus AppImage if the runner has the tools for it) — driven by the same
# bundle.fileAssociations config used everywhere else (see
# src-tauri/tauri.conf.json and CLAUDE.md). Each artifact is staged flat
# (see the "Stage installer(s)" step) so downloading and unzipping it
# hands you the installer directly, not a folder tree to click through.
#
# Pushing a `v*` tag additionally runs the `release` job, which collects
# every platform's staged installers and checksums into a GitHub Release —
# see that job for why this is separate from the artifact upload above.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least-privilege default for every job's GITHUB_TOKEN. Only the `release`
# job needs more, and it declares its own block below. Third-party
# actions are pinned to full commit SHAs (the `# vX.Y.Z` comment is the
# human-readable tag they were resolved from) so a moved or compromised
# upstream tag can't change what runs here — dependabot
# (.github/dependabot.yml) proposes the bumps.
permissions:
  contents: read

jobs:
  # Fast compile-only gate for the two platforms nobody builds on locally
  # (dev machine is macOS, per CLAUDE.md). Catches platform-cfg mistakes —
  # e.g. matching a macOS-only tauri::RunEvent variant unconditionally —
  # in ~2 minutes instead of after the full `build` job's Tauri bundling
  # pipeline runs. macOS itself is intentionally excluded here: it's
  # already exercised by every local `cargo build`/`cargo test`, and its
  # own leg below covers it.
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            name: linux
            args: ''
          - platform: windows-latest
            name: windows
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS builds need both Apple Silicon and Intel
          # targets installed; Linux/Windows build for the host only.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      # actions/upload-artifact preserves directory structure starting at
      # the first wildcard segment in `path` — globbing straight into
      # target/ meant downloaded artifacts unzipped into
      # release/bundle/<type>/ before you reached the actual installer.
      # Stage every installer *file* Tauri produced (tauri.conf.json's
      # targets:"all" means every format available on the OS, not just
      # one — Windows gets NSIS+MSI, Linux gets deb/rpm/AppImage) into a
      # flat directory first, so the artifact zip has no wrapper folders
      # at all. bundle/macos/<App>.app is deliberately pruned: it's a
      # directory tree (the raw .app bundle), not a double-clickable
      # installer — the .dmg next to it is.
      #
      # Plain `find`, not a bash globstar loop: macos-latest's default
      # `bash` in PATH is the OS-shipped 3.2 (Apple froze it there over
      # GPLv3 licensing — confirmed locally, `bash --version`), and
      # `globstar` needs bash 4+. `shell: bash` steps run with `-e` by
      # default, so `shopt -s globstar` failing on an old bash would abort
      # the whole step, not just no-op. `find`'s `-prune`/`-o`/`-exec` are
      # POSIX and behave the same under GNU find (Linux, and Windows via
      # Git Bash) and BSD find (macOS) — no shell-version dependency.
      - name: Stage installer(s) for upload
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -path '*/bundle/macos' -prune -o -path '*/bundle/*' -type f -exec cp {} dist/ \;
          ( cd dist && shasum -a 256 * > SHA256SUMS-${{ matrix.name }}.txt )
          ls -la dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mdreader-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Only runs on a `v*` tag push (see the `on:` trigger above). Collects
  # every platform's staged installers + SHA256SUMS from the `build` job
  # into one GitHub Release. Kept as a separate job (not folded into
  # `build`) because it needs all three platforms' artifacts downloaded
  # together before it can publish — `build`'s own upload-artifact step
  # above is unconditional and keeps working the same for ordinary
  # branch/PR pushes, which never reach this job at all.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten into one release directory
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release

      # Public-repo only: produces a verifiable provenance attestation for
      # every installer (`gh attestation verify`). This repo is private
      # today, and GitHub's attestation API rejects private-repo requests —
      # continue-on-error keeps that failure from blocking the Release
      # publish below. Drop continue-on-error once the repo goes public
      # (Tier 1 in the trust-hardening plan).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: 'release/*'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

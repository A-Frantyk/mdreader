name: Build

# Pushing a `v*` tag additionally publishes installers as a GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least-privilege default; `release` below needs more. Actions are pinned to full
# commit SHAs (trailing comment = the resolved tag/branch) — dependabot proposes bumps.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch, not a version tag)

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: npm test
        run: npm test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            name: linux
            # No AppImage: its bundler's unretried multi-tool download flaked CI with a
            # transient error, and it can't register the .md file association anyway.
            args: '--bundles deb rpm'
          - platform: windows-latest
            name: windows
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch, not a version tag)
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      # Regression guard for the signingIdentity invariant (CLAUDE.md) — --verify must
      # pass; spctl rejecting an unnotarized app here is expected, logged only.
      - name: Verify macOS code signature
        if: matrix.platform == 'macos-latest'
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/mdreader.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" || true
          spctl -a -t exec -vv "$APP" || true

      # Tag builds only (a signing request per PR/branch push would burn the free
      # SignPath Foundation quota for nothing) and only once the repo var below is
      # set, i.e. once SignPath has approved the project — keeps this workflow green
      # before and during that application.
      - name: Upload unsigned Windows installers for signing
        id: upload-unsigned
        if: matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mdreader-windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Signs the outer installers, not the inner mdreader.exe — SmartScreen's
      # reputation check runs on the Mark-of-the-Web'd file the user downloads and
      # double-clicks, which is the installer. Blocks on manual approval in SignPath
      # (release-signing policy); see CLAUDE.md's signing invariant.
      - name: Sign Windows installers via SignPath
        if: steps.upload-unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mdreader
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify Windows code signature
        if: steps.upload-unsigned.outcome == 'success'
        shell: pwsh
        run: |
          Get-ChildItem signed -Recurse -Include *.exe,*.msi | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "$($_.Name) is not validly signed: $($sig.Status)" }
          }

      # Staged flat, not globbed straight from target/, so upload-artifact's path
      # structure stays sane. Filtered to these five extensions specifically — an
      # unfiltered `-path '*/bundle/*' -type f` swept packaging scaffolding into a real
      # release once already (see git blame). Plain `find`, not bash globstar: macOS's
      # default bash 3.2 has no globstar, and `-e` would abort the step on that failing.
      # `signed/` (present only when the SignPath step above ran) overwrites the
      # matching unsigned filenames last, so SHA256SUMS is computed over the signed
      # bytes actually shipped — must stay last or checksums/attestation would cover
      # the wrong file.
      - name: Stage installer(s) for upload
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -path '*/bundle/*' -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} dist/ \;
          if [ -d signed ]; then find signed -type f -exec cp {} dist/ \; ; fi
          ( cd dist && { command -v sha256sum >/dev/null 2>&1 && sha256sum * || shasum -a 256 *; } > SHA256SUMS-${{ matrix.name }}.txt )
          ls -la dist

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mdreader-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Separate from `build` — needs all three platforms' artifacts downloaded together.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Needed to pick up scripts/install-macos.sh below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all platform installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Flatten into one release directory
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          cp scripts/install-macos.sh release/
          ls -la release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'release/*'

      # Prepended to the auto-generated changelog, not replaced — kept here (not just
      # README.md) since the person hitting the Gatekeeper prompt is on this page.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## First launch

            - **macOS** — ad-hoc signed, not notarized (no paid Apple
              Developer Program membership; no free substitute exists), so
              first launch shows *"Apple could not verify ... is free of
              malware"*. Clear it via **System Settings → Privacy & Security
              → Open Anyway** (macOS 15 removed the old right-click → Open
              bypass), or skip the dialog entirely with the bundled
              `install-macos.sh` below — download it, read it, then
              `sh install-macos.sh`. It verifies the `.dmg`'s checksum,
              installs to `/Applications`, and clears the quarantine flag
              that triggers the prompt.
            - **Windows** — SmartScreen shows "Windows protected your PC"
              because the installer isn't signed by a paid CA certificate.
              Click **More info → Run anyway**.

            See the [README](https://github.com/A-Frantyk/mdreader#download--install)
            for full details.
